<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsuspecting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
<base target="_blank">
</head>
<body>
    <div class="container">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>

        <div class="snowflake sf-1">&#10052;</div>
        <div class="snowflake sf-2">&#10053;</div>
        <div class="snowflake sf-3">&#10052;</div>
        <div class="snowflake sf-4">&#10053;</div>
        <div class="snowflake sf-5">&#10052;</div>

        <header>
            <div class="logo-row">
                <div class="logo-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                        <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="url(#grad1)" opacity="0.9" />
                        <path d="M2 17L12 22L22 17" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
                        <path d="M2 12L12 17L22 12" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
                        <defs>
                            <linearGradient id="grad1" x1="2" y1="2" x2="22" y2="22">
                                <stop offset="0%" stop-color="#a78bfa" />
                                <stop offset="100%" stop-color="#6366f1" />
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div class="logo-text">
                    <h1>Unsuspecting</h1>
                    <p>Frost injection toolkit</p>
                </div>
            </div>
            <div class="version-badge">v1.0</div>
        </header>

        <div id="main-content">
            <div class="card">
                <div class="input-group">
                    <label for="robux-amount">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10" />
                            <path d="M16 8h-6a2 2 0 100 4h4a2 2 0 110 4H8" />
                            <path d="M12 18V6" />
                        </svg>
                        Robux Balance
                    </label>
                    <div class="input-wrapper">
                        <span class="robux-icon">R$</span>
                        <input type="number" id="robux-amount" value="10000000">
                    </div>
                </div>

                <div class="divider"></div>

                <div class="input-group">
                    <label for="display-name">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        Display Name
                    </label>
                    <div class="input-wrapper">
                        <input type="text" id="display-name" placeholder="Display Name" style="padding-left: 14px;">
                    </div>
                </div>

                <div class="divider"></div>

                <div class="input-group">
                    <label for="username">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
                            <circle cx="8.5" cy="7" r="4"/>
                            <path d="M20 8v6M23 11h-6"/>
                        </svg>
                        Username
                    </label>
                    <div class="input-wrapper">
                        <span class="robux-icon" style="position: static; margin-left: 14px; margin-right: 4px;">@</span>
                        <input type="text" id="username" placeholder="username" style="padding-left: 8px;">
                    </div>
                </div>

                <div class="divider"></div>

                <div class="input-group">
                    <label for="manual-item-id">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 5v14M5 12h14" />
                        </svg>
                        Add Larp Item
                    </label>
                    <div class="input-wrapper" style="display: flex; gap: 8px;">
                        <div style="flex: 1; position: relative; background: rgba(0, 0, 0, 0.35); border-radius: var(--radius-sm); border: 1px solid var(--border); display: flex; align-items: center;">
                            <span class="robux-icon" style="position: static; margin-left: 14px; margin-right: 4px;">#</span>
                            <input type="number" id="manual-item-id" placeholder="Asset ID" style="background: transparent; border: none; padding-left: 8px; box-shadow: none;">
                        </div>
                        <button id="add-item-btn" class="primary-btn" style="padding: 0 16px; margin: 0; min-height: 48px;">Add</button>
                    </div>
                </div>

                <div class="divider"></div>

                <div class="btn-group" style="flex-wrap: wrap; gap: 8px;">
                    <button id="save-btn" class="primary-btn" style="flex: 1; min-width: 45%;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12" />
                        </svg>
                        Save Config
                    </button>
                    <button id="reset-btn" class="secondary-btn" style="flex: 1; min-width: 45%;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="1 4 1 10 7 10" />
                            <path d="M3.51 15a9 9 0 102.13-9.36L1 10" />
                        </svg>
                        Reset All
                    </button>
                </div>
            </div>

            <footer>
                <div class="status-row">
                    <div class="status-indicator">
                        <span class="status-dot"></span>
                        <span id="status" class="status-text">Active</span>
                    </div>
                    <span class="footer-hint">Extension is running</span>
                </div>
            </footer>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
